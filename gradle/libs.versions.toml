[versions]

# Build constants
compileSdk = "36"
java = "VERSION_17"
material = "1.13.0"
minSdk = "26"
targetSdk = "34"

# AndroidX
appcompat = "1.7.1"
constraintlayout = "2.2.1"
coreKtx = "1.18.0"

# Testing
archCoreTesting = "2.2.0"
espressoCore = "3.5.1"
junit4 = "4.13.2"
junitExt = "1.1.5"
mockk = "1.13.13"
turbine = "1.1.0"

# Static analysis
detekt = "1.23.8"
detektTwitterComposeRules = "0.0.26"

# Networking
retrofit = "2.11.0"
okhttp = "4.12.0"
gson = "2.11.0"

# Database
room = "2.6.1"

# DI
koin = "3.5.6"

# Images
coil = "2.6.0"

# Navigation
navigation = "2.8.5"

# Compose
composeBom = "2024.12.01"
activityCompose = "1.9.0"

# Coroutines
coroutines = "1.8.1"

# Lifecycle
lifecycle = "2.8.1"

# Fragment
fragment = "1.8.0"

[libraries]

# AndroidX
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }

# UI
material = { module = "com.google.android.material:material", version.ref = "material" }

# Testing
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espressoCore" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
junit-ext = { module = "androidx.test.ext:junit", version.ref = "junitExt" }
test-archCore = { module = "androidx.arch.core:core-testing", version.ref = "archCoreTesting" }
test-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
test-mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
test-turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

# Static analysis
staticAnalysis-detektApi = { module = "io.gitlab.arturbosch.detekt:detekt-api", version.ref = "detekt" }
staticAnalysis-detektCli = { module = "io.gitlab.arturbosch.detekt:detekt-cli", version.ref = "detekt" }
staticAnalysis-detektFormatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }
staticAnalysis-detektLibraries = { module = "io.gitlab.arturbosch.detekt:detekt-rules-libraries", version.ref = "detekt" }
staticAnalysis-detektPlugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
staticAnalysis-detektTest = { module = "io.gitlab.arturbosch.detekt:detekt-test", version.ref = "detekt" }
staticAnalysis-detektTwitterComposeRules = { module = "com.twitter.compose.rules:detekt", version.ref = "detektTwitterComposeRules" }

# Networking
network-retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
network-retrofitGson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
network-okhttpBom = { module = "com.squareup.okhttp3:okhttp-bom", version.ref = "okhttp" }
network-okhttp = { module = "com.squareup.okhttp3:okhttp" }
network-okhttpLogging = { module = "com.squareup.okhttp3:logging-interceptor" }
network-gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

# Database
database-roomRuntime = { module = "androidx.room:room-runtime", version.ref = "room" }
database-roomKtx = { module = "androidx.room:room-ktx", version.ref = "room" }
database-roomCompiler = { module = "androidx.room:room-compiler", version.ref = "room" }

# DI
di-koinCore = { module = "io.insert-koin:koin-core", version.ref = "koin" }
di-koinAndroid = { module = "io.insert-koin:koin-android", version.ref = "koin" }
di-koinCompose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }
di-koinTest = { module = "io.insert-koin:koin-test", version.ref = "koin" }
di-koinTestJunit4 = { module = "io.insert-koin:koin-test-junit4", version.ref = "koin" }

# Images
images-coilCompose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }

# Navigation
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
navigation-fragment = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
navigation-ui = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }

# Compose
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-uiToolingPreview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-uiTooling = { module = "androidx.compose.ui:ui-tooling" }
compose-uiTestJunit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-uiTestManifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-materialIconsExtended = { module = "androidx.compose.material:material-icons-extended" }
compose-activity = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
compose-lifecycleViewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Coroutines
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# Lifecycle
lifecycle-viewmodelKtx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-livedataKtx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle" }
lifecycle-runtimeKtx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-runtimeCompose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

# Fragment
fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
fragment-compose = { module = "androidx.fragment:fragment-compose", version.ref = "fragment" }

[bundles]
network = ["network-retrofit", "network-retrofitGson", "network-okhttp", "network-okhttpLogging"]
database = ["database-roomRuntime", "database-roomKtx"]
compose = ["compose-ui", "compose-uiToolingPreview", "compose-material3", "compose-activity", "compose-lifecycleViewmodel", "lifecycle-runtimeCompose"]
coroutines = ["coroutines-core", "coroutines-android"]
lifecycle = ["lifecycle-viewmodelKtx", "lifecycle-livedataKtx", "lifecycle-runtimeKtx"]
